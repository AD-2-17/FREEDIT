[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["dependencies"]
solc_version = "0.8.30"
# Arc targets the Osaka hard fork, a superset of Prague (docs: evm-differences).
evm_version = "prague"
# Turns on Arc's precompiles (native USDC, blocklist) in tests, forks and scripts. Without it, the real
# USDC's transferFrom calls the blocklist precompile at 0x1800…0001, which burns all the gas and reverts.
# Same as `--network arc` on the command line. Found by testing on 10-12; the docs.arc.io pages don't mention it.
network = "arc"
optimizer = true
optimizer_runs = 10000
remappings = [
  "@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.6.1/",
  "forge-std/=dependencies/forge-std-1.16.2/src/",
]

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = true

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"
arc_mainnet = "https://rpc.mainnet.arc.io"

[soldeer]
remappings_generate = false
remappings_regenerate = false

[dependencies]
forge-std = "1.16.2"
"@openzeppelin-contracts" = "5.6.1"
